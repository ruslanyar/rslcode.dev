<svg viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rslcode logo">
  <defs>
    <linearGradient id="rslGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <!-- Лёгкое «дыхание» оттенка -->
      <animate attributeName="x2" values="100%;95%;100%" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feColorMatrix in="blur2" type="matrix"
        values="0 0 0 0 0.13
                0 0 0 0 0.74
                0 0 0 0 0.97
                0 0 0 1 0" result="c1"/>
      <feMerge>
        <feMergeNode in="c1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      :root { color-scheme: dark }
      .text-main { font: 800 48px/1 Inter,system-ui,Segoe UI,Roboto,Ubuntu,Cantarell,'Helvetica Neue',Arial,sans-serif }
      .text-reg  { font: 400 48px/1 Inter,system-ui,Segoe UI,Roboto,Ubuntu,Cantarell,'Helvetica Neue',Arial,sans-serif }
      .glow { filter:url(#softGlow) }
      .pulse { animation:pulse 2.8s ease-in-out infinite }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: translateZ(0) }
        50%      { opacity: .8 }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none }
      }
    </style>
  </defs>


  <g class="glow pulse">
    <text x="20" y="50" class="text-main" fill="url(#rslGrad)">rsl</text>
  </g>

  <text x="96" y="50" class="text-reg" fill="#f8fafc">code</text>
</svg>
